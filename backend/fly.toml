# fly.toml app configuration file generated for graphene-trace-api on 2026-01-22T11:22:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'graphene-trace-api'
primary_region = 'iad'

[build]

[env]
  PORT = "8000"
  DEBUG = "False"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "10s"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
